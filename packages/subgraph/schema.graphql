# HubDAO
type DaoRegistry @entity {
    id: ID! "DaoRegistryID"
    daoInfos: [DaoInfo!]
}

type DaoTemplate @entity {
    id: ID! "{TemplateType}"
    daoType: DaoTemplateType
    dictionaryAddress: Bytes
}
enum DaoTemplateType {
    undefined
    TextDAO
    TextDAOWithCheats
}

type DaoInfo @entity {
    id: ID! "{DaoAddress}"
    daoType: DaoTemplateType
    address: Bytes
    cid: String! # metadataCid
    metadata: DaoMetadata
}
type DaoMetadata @entity {
    id: ID! "{ipfsCid}"
    name: String
    image: String
    description: String
}

type GlobalConfig @entity {
    id: ID! "GlobalConfigID"
    baseCurrency: Bytes
}

type User @entity {
    id: ID! "{address}"
    addr: Bytes!
    infoCid: String
    info: UserInfo
}

type UserInfo @entity {
    id: ID! "{ipfsCid}"
    name: String
    image: String
    bio: String
}

# TextDAOs

type DeliberationConfig @entity {
    id: ID! "DeliberationConfigID"
    expiryDuration: BigInt!
    snapInterval: BigInt!
    repsNum: BigInt!
    quorumScore: BigInt!
    lastUpdated: BigInt!
}

type Proposal @entity {
    id: ID! "{pid}"
    headers: [Header!] @derivedFrom(field: "proposal")
    cmds: [Command!] @derivedFrom(field: "proposal")
    # meta
    proposer: Bytes
    createdAt: BigInt
    expirationTime: BigInt
    # voting status
    reps: [Bytes!]
    votes: [Vote!] @derivedFrom(field: "proposal")
    approvedHeaderId: BigInt
    approvedCommandId: BigInt
    fullyExecuted: Boolean
    vrfRequestId: BigInt
    snapInterval: BigInt
    snappedEpoch: [BigInt!]
    snappedTimes: [BigInt!]
    topHeaders: [TopHeader!]
    topCommands: [TopCommand!]
}

type Header @entity {
    id: ID! "header-{pid}-{headerId}"
    proposal: Proposal!
    contents: HeaderContents
    cid: String!
    createdAt: BigInt!
    index: BigInt!
}

type HeaderContents @entity {
    id: ID! "{ipfsCid}"
    title: String
    body: String
}

type Command @entity {
    id: ID! "command-{pid}-{commandId}"
    proposal: Proposal!
    actions: [Action!]! @derivedFrom(field: "command")
    createdAt: BigInt!
    index: BigInt!
}

type Action @entity {
    id: ID! "{pid}-{commandId}-{actionIndex}"
    command: Command! # parent
    func: String!
    abiParams: Bytes!
    status: ActionStatus!
}

enum ActionStatus {
    Proposed
    Approved
    Executed
}

type TopHeader @entity {
    id: ID! "topHeader-{pid}-{epoch}-{index}"
    snappedEpoch: BigInt!
    index: BigInt! # rank-like
    header: Header!
}

type TopCommand @entity {
    id: ID! "topCommand-{pid}-{epoch}-{index}"
    snappedEpoch: BigInt!
    index: BigInt! # rank-like
    command: Command!
}

type Vote @entity {
    id: ID! "{pid}-{repAddress}"
    proposal: Proposal! # parent
    rep: Bytes! # mapping-key
    rankedHeaderIds: [BigInt!]
    rankedCommandIds: [BigInt!]
    createdAt: BigInt!
    updatedAt: BigInt!
}

type Text @entity {
    id: ID! "{textId}"
    contents: TextContents
    cid: String!
    createdAt: BigInt!
    updatedAt: BigInt!
    index: BigInt!
}

type TextContents @entity {
    id: ID! "{ipfsCid}"
    title: String
    body: String
}

type Member @entity {
    id: ID! "{memberId}"
    addr: Bytes!
    info: MemberInfo
    cid: String
    createdAt: BigInt!
    updatedAt: BigInt!
    index: BigInt!
}

type MemberInfo @entity {
    id: ID! "{ipfsCid}"
    name: String
    image: String
    bio: String
}
